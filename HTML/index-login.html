<!DOCTYPE html>
<html lang="es">
<head>

<meta charset="UTF-8">
<meta name="viewport"
content="width=device-width, initial-scale=1.0">
<link href="https://cdn.boxicons.com/2.1.4/css/boxicons.min.css"
rel="stylesheet">

<link rel="stylesheet" href="../CSS/style.css">

<title>Campus Parking</title>

</head>
<body>

<div class="wrapper">

    <nav class="nav">

        <div class="nav-logo">
            <p>Campus Parking</p>
        </div>

    </nav>

    <div class="form-box">

        <!-- LOGIN -->

        <div class="login-container"
        id="login">

            <div class="top">

                <span class="switch-text">

                    ¿No tienes cuenta?

                    <a href="#"
                    onclick="register()">

                        Regístrate

                    </a>

                </span>

                <header>Iniciar Sesión</header>

            </div>

            <form id="loginForm">

                <div class="input-box">

                    <input
                    type="email"
                    class="input-field"
                    id="loginEmail"
                    placeholder="Correo"
                    required>

                    <i class='bx bx-envelope'></i>

                </div>

                <div class="input-box">

                    <input
                    type="password"
                    class="input-field"
                    id="loginPassword"
                    placeholder="Contraseña"
                    required>

                    <i class='bx bx-lock-alt'></i>

                </div>

                <p id="loginMessage"></p>

                <button
                type="submit"
                class="submit">

                    Ingresar

                </button>

            </form>

        </div>

        <!-- REGISTER -->

        <div class="register-container"
        id="register">

            <div class="top">

                <span class="switch-text">

                    ¿Ya tienes cuenta?

                    <a href="#"
                    onclick="login()">

                        Login

                    </a>

                </span>

                <header>Registro</header>

            </div>

            <form id="registerForm">

                <div class="input-box">

                    <input
                    type="text"
                    class="input-field"
                    id="registerName"
                    placeholder="Nombre"
                    required>

                    <i class='bx bx-user'></i>

                </div>

                <div class="input-box">

                    <input
                    type="email"
                    class="input-field"
                    id="registerEmail"
                    placeholder="Correo"
                    required>

                    <i class='bx bx-envelope'></i>

                </div>

                <div class="input-box">

                    <input
                    type="password"
                    class="input-field"
                    id="registerPassword"
                    placeholder="Contraseña"
                    required>

                    <i class='bx bx-lock-alt'></i>

                </div>

                <p id="registerMessage"></p>

                <button
                type="submit"
                class="submit">

                    Registrarse

                </button>

            </form>

        </div>

    </div>

</div>

<script src="../JS/login.js"></script>

</body>
</html>
