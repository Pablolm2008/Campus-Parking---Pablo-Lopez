<!DOCTYPE html>
<html lang="es">
<head>

<meta charset="UTF-8">

<meta name="viewport"
content="width=device-width, initial-scale=1.0">

<link href="https://cdn.boxicons.com/2.1.4/css/boxicons.min.css"
rel="stylesheet">

<link rel="stylesheet"
href="../CSS/profile.css">

<title>Perfil Usuario</title>

</head>
<body>

<!-- OVERLAY -->

<div class="overlay"></div>

<!-- TOP BAR -->

<div class="top-bar">

    <button class="back-btn"
    onclick="goBack()">

        <i class='bx bx-arrow-back'></i>
        Regresar

    </button>

</div>

<!-- PROFILE CARD -->

<div class="profile-container">

    <div class="profile-header">

        <div>

            <h1>Perfil Usuario</h1>

            <p>
                Administra tu información personal
            </p>

        </div>

        <div class="profile-icon">

            <i class='bx bx-user-circle'></i>

        </div>

    </div>

    <!-- INFO -->

    <div class="profile-info">

        <div class="info-card">

            <span>Nombre</span>
            <h3 id="currentName"></h3>

        </div>

        <div class="info-card">

            <span>Correo</span>
            <h3 id="currentEmail"></h3>

        </div>

    </div>

    <!-- BUTTON -->

    <button class="edit-btn"
    id="openModal">

        <i class='bx bx-edit'></i>
        Editar Perfil

    </button>

</div>

<!-- MODAL -->

<div class="modal"
id="profileModal">

    <div class="modal-content">

        <div class="modal-header">

            <h2>Editar Perfil</h2>

            <button class="close-btn"
            id="closeModal">

                <i class='bx bx-x'></i>

            </button>

        </div>

        <form id="profileForm">

            <div class="input-group">

                <label>Nombre</label>

                <input
                type="text"
                id="name"
                placeholder="Nombre">

            </div>

            <div class="input-group">

                <label>Correo electrónico</label>

                <input
                type="email"
                id="email"
                placeholder="Correo">

            </div>

            <div class="input-group">

                <label>Contraseña</label>

                <input
                type="password"
                id="password"
                placeholder="Contraseña">

            </div>

            <button type="submit"
            class="save-btn">

                <i class='bx bx-save'></i>
                Guardar Cambios

            </button>

        </form>

    </div>

</div>

<script src="../JS/profile.js"></script>

</body>
</html>
